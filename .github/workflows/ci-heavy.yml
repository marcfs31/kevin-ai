name: ci-heavy

# Backstop for the local .githooks/pre-push run of scripts/ci-heavy.sh. Weekly, not per pull.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Heavy checks (sanitizers, portable build)
        run: scripts/ci-heavy.sh
